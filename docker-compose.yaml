version: '3.3'

services:
  url-shortener:
    image: ghcr.io/mhkarimi1383/url-shortener:main
    ports:
      - 8080:8080
    environment:
      - USH_ADD_REFERER_QUERY_PARAM=true
      # use postgres://127.0.0.1:5432/url_shortener for postgres and root:@tcp(127.0.0.1:3306)/url_shortener?charset=utf8 for mysql
      - USH_DATABASE_CONNECTION_STRING=/data/database.sqlite3
      # Could be one of pgx, sqlite, mysql
      - USH_DATABASE_ENGINE=sqlite
      # Do not forget to change JWT Secret
      - USH_JWT_SECRET=changeme
      - USH_LISTEN_ADDRESS=0.0.0.0:8080
      - USH_MIGRATE=true
      - USH_RANDOM_GENERATOR_MAX=10000
      - USH_ROOT_REDIRECt=/ui/
      - USH_RUN_SERVER=true
      # Optional Redis redirect cache. Leave unset to read redirects from the database.
      # - USH_REDIS_ADDRESS=redis:6379
      # - USH_REDIS_PASSWORD=
      # - USH_REDIS_DATABASE=0
      # - USH_REDIS_CACHE_TTL=24h
      # - USH_REDIS_DIAL_TIMEOUT=100ms
      # - USH_REDIS_READ_TIMEOUT=100ms
      # - USH_REDIS_WRITE_TIMEOUT=100ms
      # Visit statistics are aggregated in this process and flushed in the background.
      - USH_VISIT_FLUSH_INTERVAL=5s
      - USH_VISIT_BUFFER_MAX_ENTRIES=100000
